  return chrome("<h1>Now say it yourself</h1>" +
  '<p class="lede">' + sayLede + "</p>" +
  (before ? '<h2 style="margin-top:0">Reply to this</h2>' + before : "") +
  '<div class="turn jamie"><div class="who">' + esc(me) + (me==="You" ? "" : " · you") +
    '</div><div class="bub blank">your turn…</div></div>' +
  '<textarea id="draft" placeholder="Écrivez ou parlez…">' + esc(S.draft) + "</textarea>" +
  ((S.recording||S.heard) ? '<div class="heard" id="heard"></div>' : "") +
  '<div class="row"><button class="mic ' + (S.recording?"on":"") + '" id="mic">' +
    (S.recording ? "◼ Stop" : (S.heard ? "🎙 Again" : "🎙 Say it")) + "</button>" +
  '<button class="go" id="check" ' + ((S.draft.trim()||S.heard)?"":"disabled") + ">Check</button></div>" +
  (v ? '<div class="verdict ' + v.kind + '"><b>' +
      (v.kind==="ok" ? "That keeps it going" : v.kind==="near" ? "That works, but it's a dead end"
        : v.kind==="skip" ? "Not checked" : "That doesn't answer it") + "</b>" +
      esc(v.note) + coach +
      (S.revealed ? '<div class="reveal"><span class="reflab">' + esc(revealLabel) + "</span>" +
        esc(target) + "</div>" : "") + "</div>" : "") +
  (S.hinted && !S.revealed
    ? '<div class="verdict near"><b>Hint</b>' +
      (meaning ? "What to get across: <em>" + esc(meaning) + "</em><br>" : "") +
      (learnerActive() ? "Your line opened with « " : "A French speaker opened with « ") +
      esc(chunk(target)[0]) + "… »" +
      (inLine.length ? " and used " + inLine.map(p=>"<code>"+esc(p)+"</code>").join(" ") : "") +
      ".</div>" : "") +
  '<div class="bar">' +
    (S.revealed
      ? '<button class="go" id="nextline">' + (S.i+1<idxs.length?"Next line →":"Finish →") + "</button>"
      : (v ? '<button class="ghost" id="retry">Try again</button>' : "") +
        (!S.hinted ? '<button class="ghost" id="hint">Give me a hint</button>' : "") +
        (canReveal
          ? '<button class="go" id="show">' +
            (learnerActive() ? "Show my reference line" : "Show me how they said it") + "</button>"
          : "")) +
    '<button class="ghost" id="toggle">' + (S.showEn?"Hide":"Show") + " English</button></div>" +
  cardHTML());
}

/* Goal-capture prompt (goal-linked-reminders spec, Requirement 1.1/1.2/1.4/1.6).
   Shown once at the end of the first session — one optional free-text goal, one
   optional date (date only, no time), a Save and a Skip. Never blocks the app:
   returns "" when it should not appear (already dismissed this session, or a
   goal already exists in the store), so the rest of the screen is unaffected. */
function goalPromptHTML(){
  if (S.goalPromptDismissed) return "";
  // Only offer it when no goal is already set. Feature-detect the store bridge;
  // if it hasn't loaded, skip the prompt rather than block (it re-renders when
  // the module becomes ready via window.onReminderStoreReady).
  const store = window.ReminderStore;
  if (!store) return "";
  let existing = "";
  try { existing = (store.loadState().goal || "").trim(); } catch { existing = ""; }
  if (existing) return "";
  return '<div class="scene" id="goalprompt" style="margin-top:22px">' +
    "<b>One thing before you go — why are you learning French?</b>" +
    '<p style="margin:4px 0 12px">Optional. If you tell us, your reminders can point ' +
    "at it. Skip and reminders still work — they'll just name the next thing.</p>" +
    '<label class="reflab" for="goaltext">Your goal</label>' +
    '<textarea id="goaltext" placeholder="e.g. A trip to France"></textarea>' +
    '<label class="reflab" for="goaldate" style="margin-top:12px">Target date (optional)</label>' +
    '<input type="date" id="goaldate" style="width:100%;padding:12px;border:1px solid var(--line);' +
      'border-radius:12px;font:inherit;background:#fff">' +
    '<div class="row"><button class="go" id="goalsave">Save goal</button>' +
    '<button class="ghost" id="goalskip">Skip</button></div></div>';
}

/* Notification opt-in (goal-linked-reminders task 10, Req 5.1/5.2/5.4/5.6).
   Offered ONCE at the end of the first session, tied to the promise copy
   ("Want a nudge when the café one is ready?"). This is the ONLY place the app
   ever requests notification permission — NEVER on page load (Req 5.2). Returns
   "" when it should not appear: already handled this session, or permission is
   already granted (worker set up) — so the done screen is otherwise unchanged.
   Where notifications are unsupported/denied it says so plainly (Req 5.4/5.6)
   and the in-app banner remains the fallback. */
function pushOptInHTML(){
  if (S.pushOptInDismissed) return "";
  const push = window.ReminderPush;
  // No push helper (module not loaded) -> offer nothing; the in-app banner and
  // settings toggle still cover reminders.
  if (!push) return "";

  // Unsupported browser: say so plainly, no button (Req 5.6). The banner remains.
  if (!push.supported || !push.supported()) {
    return '<div class="scene" id="pushoptin" style="margin-top:16px">' +
      "<b>Want a nudge when the café one is ready?</b>" +
      '<p class="note-s" style="margin-top:6px">This browser can\'t show ' +
      "notifications, so we can\'t send a nudge here — the reminder still shows " +
      "inside the app whenever you open it.</p></div>";
  }

  // Already granted: the worker is set up; nothing to ask.
  const state = push.permissionState ? push.permissionState() : "default";
  if (state === "granted") return "";

  // Denied earlier: be honest, no button (Req 5.4/5.6). Banner remains.
  if (state === "denied") {
    return '<div class="scene" id="pushoptin" style="margin-top:16px">' +
      "<b>Want a nudge when the café one is ready?</b>" +
      '<p class="note-s" style="margin-top:6px">Notifications are blocked in ' +
      "this browser, so we\'ll keep the reminder inside the app — you\'ll see it " +
      "whenever you open it.</p></div>";
  }

  // Fresh opt-in (permission "default"). One honest button + a plain note about
  // the limitation (Req 5.6): a locally-scheduled nudge, in-app banner as backup.
  return '<div class="scene" id="pushoptin" style="margin-top:16px">' +
    "<b>Want a nudge when the café one is ready?</b>" +
    '<p style="margin:6px 0 12px">One goal-linked reminder, at most one follow-up ' +
    "— then quiet. It\'s a local nudge from this device (it can\'t reach you when " +
    "the browser is fully closed); the reminder always waits inside the app too." +
    "</p>" +
    '<div class="row"><button class="go" id="pushenable">Yes, nudge me</button>' +
    '<button class="ghost" id="pushnothanks">Not now</button></div>' +
    '<p class="note-s" id="pushoptinnote" style="margin-top:10px"></p></div>';
}

function screenDone(){
  const mine = Object.keys(S.mine).filter(k=>(S.mine[k]||"").trim());
  // A learner session's "about" line is app-authored English framing — never
  // learner French (Req 11.5). Authored_Content keeps its weekend summary.
  const about = learnerActive() ? "your own material" : esc(conv().en.toLowerCase());

  /* content-to-exercise task 9.3 — the Done screen built from learner content.
     Everything shown here is evidence, never a score: no fraction, percentage,
     count of attempts/correct answers, level, or streak appears on this screen
     (Req 9.3, PRD §4.1/§16.8/§17.1). S.said[*].kind is recorded only to drive
     the prior Say-it feedback; it is deliberately NOT rendered as a tally. */

  // Empty session (Req 9.5): the learner kept nothing this session — no attempts
  // and no sentences they wrote against a word-card. Show a plain-English message
  // rather than an empty screen or any fabricated evidence. (Authored_Content
  // always walks every Jamie turn, so S.said is non-empty there; this branch is
  // reached only by a learner session that produced no evidence.)
  if (learnerActive() && S.said.length === 0 && mine.length === 0){
    return chrome("<h1>Conversation finished</h1>" +
    '<div class="done-panel"><b>No sentences were kept this session</b>' +
      "You didn't say or write anything to keep this time, so there's nothing to " +
      "show here yet. Nothing was scored. Start again when you're ready and the " +
      "sentences you say and write will show up as your evidence." +
      "</div>" +
    goalPromptHTML() +
    pushOptInHTML() +
    '<div class="bar"><button class="go" id="restart">Try again →</button></div>');
  }

  const headline = learnerActive()
    ? "You practised with the French you brought"
    : "You can talk about your weekend in casual French";
  // Phrases worth keeping: the tapped/saved word-cards (Req 9.2). For a learner
  // session the gloss may be null, so show the phrase alone rather than
  // fabricating English (Req 5.5). Each phrase's French is verbatim learner (or
  // authored) material — no System-generated French (Req 9.4).
  const phraseList = phrasesIn(S.key).map(p => {
    const g = glossOf(p);
    return "<p><strong>" + esc(p) + "</strong>" + (g.en != null ? " — " + esc(g.en) : "") + "</p>";
  }).join("");
  // What you said: each submitted attempt paired with the reference Source_Line
  // recorded for that attempt's exercise identity at attempt time (Req 9.1).
  // x.mine is the learner's own attempt; x.theirs is the verbatim reference line
  // captured when the attempt was judged (keyed by x.idx). Both are the learner's
  // own words / own material for a learner session — no System French (Req 9.4).
  const saidList = S.said.map(x => '<div class="said"><span class="mine">' + esc(x.mine) + "</span>" +
    '<span class="theirs">' +
    (learnerActive() ? "Your own reference line — " : "One way a French speaker put it — ") +
    esc(x.theirs) + "</span></div>").join("");
  return chrome("<h1>Conversation finished</h1>" +
  '<div class="done-panel"><b>' + headline + "</b>" +
    "You had this conversation about " + about +
    " — answering as yourself, out loud, without the words in front of you." +
    "<ul><li>Nothing was scored. There is no number here on purpose.</li>" +
    "<li>What you said is below. That is the evidence.</li></ul></div>" +
  (saidList ? "<h2>What you said</h2>" + saidList : "") +
  (phraseList ? "<h2>Phrases worth keeping</h2><div class=\"scene\">" + phraseList + "</div>" : "") +
  (mine.length ? "<h2>Sentences you wrote</h2><div class=\"scene\">" +
    mine.map(k=>"<p><strong>"+esc(k)+"</strong> — "+esc(S.mine[k])+"</p>").join("") + "</div>" : "") +
  // "What the next conversation would do" names authored French (franchement,
  // plutôt, carrément). That is System/Authored French, so it is shown ONLY for
  // an Authored_Content session; a learner Done screen never shows French the
  // learner did not supply (Req 9.4).
  (learnerActive() ? "" :
    '<div class="warnbox"><b>What the next conversation would do</b>' +
      "Meeting someone at a party, say — <code>franchement</code>, <code>plutôt</code> and " +
      "<code>carrément</code> come back in a situation you haven't seen, and nobody re-teaches " +
      "them. That is the part a chatbot can't do, and it needs a second conversation to exist.</div>") +
  goalPromptHTML() +
  pushOptInHTML() +
  '<div class="bar"><button class="go" id="restart">' +
    (learnerActive() ? "Try again →" : "Try another weekend →") + "</button></div>");
}

/* ============================ reminder settings ======================= */
/* screenSettings (goal-linked-reminders task 9). A lightweight top-level screen
   — NOT part of the six-step mission flow, so chrome() skips the steps header
   for it. Reads current values from window.ReminderStore.loadState() and lets
   the learner add/edit/clear the goal + target date (Req 1.5), adjust the
   weekly target 1–7 in plain language (Req 2.2, 2.5), and express a push
   preference reflecting the current permission state (task-9 scope; the real
   opt-in + service worker is task 10). Never shows a streak/quota/score. */
function humanCadence(n){
  // Plain-language description of the weekly target (Req 2.5). Never a quota,
  // score, or streak — just "about N times a week".
  const clamped = Math.max(1, Math.min(7, Number(n) || 3));
  if (clamped === 1) return "about once a week";
  if (clamped === 7) return "about every day";
  return "about " + clamped + " times a week";
}
function pushStateLabel(push){
  // Reflect the current permission state honestly (Req 5.6 tone).
  switch (push) {
    case "granted":     return { text:"On", note:"You've asked for nudges. Notifications get set up at the end of your first session — nothing is requested now." };
    case "denied":      return { text:"Blocked", note:"Notifications are blocked in this browser. The in-app reminder still shows everything." };
    case "unsupported": return { text:"Not supported", note:"This browser can't show notifications. The in-app reminder still shows everything." };
    default:            return { text:"Off", note:"Turn this on to ask for a nudge later. We never request permission on page load." };
  }
}
function screenSettings(){
  // Read current values from the store (feature-detected). Falls back to
  // first-run defaults if the bridge hasn't loaded, rather than blocking.
  let goal = "", targetDate = "", weeklyTarget = 3, push = "unset";
  const store = window.ReminderStore;
  if (store) {
    try {
      const st = store.loadState();
      goal = st.goal || "";
      targetDate = st.targetDate || "";
      weeklyTarget = st.weeklyTarget || 3;
      push = st.push || "unset";
    } catch { /* keep defaults */ }
  }
  const pl = pushStateLabel(push);
  const pushOn = push === "granted";
  const pushDisabled = push === "denied" || push === "unsupported";

  return chrome(
    '<button class="back" id="settingsback">← Done</button>' +
    "<h1>Reminders</h1>" +
    '<p class="lede">Your goal and how often you\'re reminded. Nothing here counts ' +
    "attendance — there is no streak or score, on purpose.</p>" +

    // GOAL — add / edit / clear (Req 1.5, 1.6).
    "<h2>Your goal</h2>" +
    '<div class="scene">' +
      '<label class="reflab" for="setgoaltext">Why you\'re learning French</label>' +
      '<textarea id="setgoaltext" placeholder="e.g. A trip to France">' + esc(goal) + "</textarea>" +
      '<label class="reflab" for="setgoaldate" style="margin-top:12px">Target date (optional)</label>' +
      '<input type="date" id="setgoaldate" value="' + esc(targetDate) + '" ' +
        'style="width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;' +
        'font:inherit;background:#fff">' +
      '<div class="row"><button class="go" id="setgoalsave">Save goal</button>' +
      '<button class="ghost" id="setgoalclear">Clear goal</button></div>' +
    "</div>" +

    // WEEKLY TARGET — plain language, 1–7, never a quota (Req 2.2, 2.5).
    "<h2>How often</h2>" +
    '<div class="scene">' +
      '<span class="setcadence" id="cadencelabel">' + esc(humanCadence(weeklyTarget)) + "</span>" +
      '<input type="range" id="setweekly" min="1" max="7" step="1" value="' + weeklyTarget + '" ' +
        'style="width:100%;margin-top:12px" aria-label="How often you\'re reminded">' +
      '<div class="cadencerange"><span>less often</span><span>more often</span></div>' +
      '<p class="note-s">A gentle pull, not a target to hit. Miss one and nothing is lost — ' +
      "the next reminder just moves along quietly.</p>" +
    "</div>" +

    // PUSH — reflect current state; record intent only (task 10 does the real
    // opt-in + service worker). Does NOT call Notification.requestPermission here
    // (Req 5.2 — never on load; opt-in flow is task 10).
    "<h2>Notifications</h2>" +
    '<div class="scene">' +
      '<label class="pushrow">' +
        '<input type="checkbox" id="setpush"' + (pushOn ? " checked" : "") +
          (pushDisabled ? " disabled" : "") + ">" +
        '<span class="pushstate" id="pushstate">' + esc(pl.text) + "</span>" +
      "</label>" +
      '<p class="note-s" id="pushnote">' + esc(pl.note) + "</p>" +
    "</div>"
  );
}

/* ============================ in-app reminder banner =================== */
/* renderBanner (goal-linked-reminders task 8). Fills #reminderbanner on every
   render(). Shows the composed, goal-linked copy with a Start action and a
   dismiss control; shows NOTHING when there is no next thing due (Req 4.4) or
   when dismissed this session (Req 4.3). Never renders a streak/count/
   attendance indicator (Req 4.5) — it only prints composeCopy's clean title +
   body. Feature-detects the module bridge so the app works without it. */
function renderBanner(){
  const host = $("reminderbanner");
  if (!host) return;

  // Feature-detect the engine + store bridge; render nothing if absent.
  const engine = window.ReminderEngine;
  const store = window.ReminderStore;
  if (!engine || !store) { host.innerHTML = ""; return; }

  // Dismissed this session -> show nothing, record no miss (Req 4.3).
  if (S.reminderDismissed) { host.innerHTML = ""; return; }

  // What's the next ready thing? In the single-conversation prototype this is
  // the café « bonjour » item. null => nothing due => render nothing (Req 4.4).
  let item = null;
  try { item = engine.nextThing({ completed: [] }); } catch { item = null; }
  if (item == null) { host.innerHTML = ""; return; }

  // Pull the goal + target date from local storage (never leaves the device).
  let goal = "", targetDate = null;
  try {
    const state = store.loadState();
    goal = state.goal || "";
    targetDate = state.targetDate || null;
  } catch { goal = ""; targetDate = null; }

  // Compose honest, goal-linked copy. null => nothing to say (Req 4.4).
  let copy = null;
  try { copy = engine.composeCopy({ nextThing: item, goal, targetDate }); }
  catch { copy = null; }
  if (copy == null) { host.innerHTML = ""; return; }

  host.innerHTML =
    '<div class="reminder" role="region" aria-label="Reminder">' +
      '<div class="rtext">' +
        '<span class="rtitle">' + esc(copy.title) + "</span>" +
        '<span class="rbody">' + esc(copy.body) + "</span>" +
      "</div>" +
      '<div class="ractions">' +
        '<button class="rstart" id="reminderstart">Start</button>' +
        '<button class="rdismiss" id="reminderdismiss">Dismiss</button>' +
      "</div>" +
    "</div>";
}

/* ================================== render ============================= */
const SCREENS = { start:screenStart, pick:screenPick, read:screenRead,
                  build:screenBuild, say:screenSay, done:screenDone,
                  settings:screenSettings };

/* renderReminderLink (task 9). Fills the persistent "Reminders" control in the
   app shell so settings is reachable from any mission screen. Hidden while
   settings is open (you leave via its own Done control). Feature-detects the
   store bridge — no link until reminders are available. */
function renderReminderLink(){
  const host = $("reminderlink");
  if (!host) return;
  if (S.screen === "settings" || !window.ReminderStore) { host.innerHTML = ""; return; }
  host.innerHTML = '<button class="remlink" id="settingsopen">⚙ Reminders</button>';
}

function render(){
  $("app").innerHTML = SCREENS[S.screen]();
  renderBanner();
  renderReminderLink();
  const on=(id,fn)=>{const e=$(id); if(e) e.addEventListener("click",fn);};

  // Settings: open from the persistent link (tracking where to return), and
  // leave via the settings Done/Back control back to the previous screen.
  on("settingsopen",()=>{
    S.settingsReturn = S.screen;   // remember where we came from
    S.screen = "settings";
    render();
  });
  on("settingsback",()=>{
    S.screen = S.settingsReturn || "start";
    render();
  });

  // Settings — goal add/edit/clear (Req 1.5).
  on("setgoalsave",()=>{
    const text = ($("setgoaltext") ? $("setgoaltext").value : "").trim();
    const date = $("setgoaldate") ? $("setgoaldate").value : ""; // yyyy-mm-dd or ""
    if (window.ReminderStore) {
      try { window.ReminderStore.saveGoal(text, date || null); } catch {}
    }
    render();
  });
  on("setgoalclear",()=>{
    if (window.ReminderStore) { try { window.ReminderStore.clearGoal(); } catch {} }
    render();
  });

  // Settings — weekly target (Req 2.2, 2.5). Live-update the plain-language
  // label as the slider moves; persist via the store on change (clamps 1–7).
  const weekly = $("setweekly");
  if (weekly) {
    weekly.addEventListener("input",e=>{
      const lab = $("cadencelabel");
      if (lab) lab.textContent = humanCadence(e.target.value);
    });
    weekly.addEventListener("change",e=>{
      const n = Number(e.target.value);
      if (window.ReminderStore && window.ReminderStore.setWeeklyTarget) {
        try { window.ReminderStore.setWeeklyTarget(n); } catch {}
      }
    });
  }

  // Settings — push preference. Turning it ON routes through the SAME opt-in/
  // enable path as the end-of-session prompt (task 10): the real permission
  // request + service-worker registration happen there, from THIS user gesture,
  // never on page load (Req 5.2). Turning it OFF just records intent. enable()
  // itself records the resulting pref ('granted'/'denied'/'unsupported'), and we
  // re-render so the state label + note reflect it honestly (Req 5.4/5.6).
  on("setpush", async ()=>{
    const box = $("setpush");
    if (!box) return;
    if (box.checked) {
      const push = window.ReminderPush;
      if (push && push.enable) {
        try { await push.enable(); } catch {}
      } else if (window.ReminderStore && window.ReminderStore.setPushPref) {
        // No push helper available: record intent so the label reflects it; the
        // actual request still only ever happens via enable().
        try { window.ReminderStore.setPushPref("granted"); } catch {}
      }
    } else {
      if (window.ReminderStore && window.ReminderStore.setPushPref) {
        try { window.ReminderStore.setPushPref("unset"); } catch {}
      }
    }
    render();
  });

  // In-app reminder banner actions (task 8). Start jumps into the mission at
  // the next thing; Dismiss hides it for this session and records NO miss
  // (Req 4.2/4.3, 6.3) — it only sets an in-memory flag and re-renders.
  on("reminderstart",()=>{
    S.reminderDismissed = true;           // the reminder has been acted on
    // Send the learner to the next thing. With no weekend chosen yet, that is
    // the pick step; if one is already chosen, resume reading it. Reuses the
    // existing screen transitions rather than inventing a new flow.
    S.screen = S.key ? "read" : "pick";
    render();
  });
  on("reminderdismiss",()=>{
    S.reminderDismissed = true;
    quietReschedule();   // not acted on: move the next slot, record NO miss (Req 6.1)
    render();
  });

  document.querySelectorAll("[data-level]").forEach(b=>b.addEventListener("click",()=>{
    S.level=b.dataset.level; render(); }));
  document.querySelectorAll("[data-src]").forEach(b=>b.addEventListener("click",()=>{
    S.source=b.dataset.src; render(); }));

  // Importer (content-to-exercise task 9.1). Keep the typed text in state on
  // every keystroke so it survives a re-render verbatim (Req 3.4) and so a stale
  // decline/warn message is cleared the moment the learner edits the text.
  const importBox = $("importtext");
  if (importBox) importBox.addEventListener("input", e => {
    S.importText = e.target.value;
    S.importResult = null;      // the previous verdict no longer describes this text
    S.importConfirm = false;    // editing invalidates any prior not-French confirm
  });


  // Gemini opt-in tick (Req 12.6). Changing it never sends anything by itself;
  // only importing (via "Start →") does, and only while it is ticked.
  const aiBox = $("aioptin");
  if (aiBox) aiBox.addEventListener("change", e => { S.aiOptIn = e.target.checked; render(); });

  // "Use it anyway": explicit learner confirmation for the not-French warning
  // (Req 3.3). Re-imports the same text with confirmation granted.
  on("importconfirm", () => runImport(true));

  // "Start →": enter the Choose step. content-to-exercise task 9.2 — when the
  // learner picked "Bring your own" AND has accepted Learner_Content, build the
  // BuiltSession now (pure Exercise_Builder: transcript/wordCards/scene/buildFor)
  // so the mission runs on the learner's own material through the shared screens
  // (Req 11.2). Otherwise S.learnerSession stays null and the mission runs on
  // Authored_Content exactly as before (Req 11.1/11.3).
  on("begin",()=>{
    const bridge = window.ContentToExercise;
    // One button: with "Bring your own" selected, Start imports what's in the
    // box first (only if it changed since the last import, so Gemini isn't asked
    // twice). A decline/warn keeps the learner here with the importer's message.
    if (S.source==="own" && bridge && bridge.importContent) {
      const box = $("importtext");
      const text = box ? box.value : (S.importText || "");
      if (!S.learnerContent || text !== S.importedText) {
        runImport(false);
        if (!S.learnerContent) return;
      } else if (S.aiOptIn && S.aiStatus !== "pending" && !S.aiTranslations) {
        // Same text as before, but the Gemini box is now ticked and this text
        // has no Gemini results yet (e.g. it was imported with the box off).
        requestAiPhrases(S.learnerContent);
      }
    }
    if (S.source==="own" && S.learnerContent && S.learnerContent.length &&
        bridge && bridge.buildExercises){
      try { S.learnerSession = bridge.buildExercises(S.learnerContent, { phrases: S.aiPhrases }); }
      catch { S.learnerSession = null; }
    } else {
      S.learnerSession = null;
    }
    S.key = null; S.chosen = false; S.reached = ORDER.indexOf("pick");
    S.screen="pick"; render();
  });
  document.querySelectorAll("[data-w]").forEach(b=>b.addEventListener("click",()=>{
    // For a learner session the single option carries data-w="__learner__": keep
    // S.key null (the conv() accessor reads S.learnerSession) and advance to Read.
    // Authored_Content options carry the weekend key, unchanged.
    if (b.dataset.w !== "__learner__") S.key=b.dataset.w;
    S.chosen = true; S.screen="read"; render(); }));
  document.querySelectorAll("[data-step]").forEach(el=>{
    const go = () => goToStep(+el.dataset.step);
    el.addEventListener("click", go);
    el.addEventListener("keydown", e => { if (e.key==="Enter" || e.key===" ") { e.preventDefault(); go(); } });
  });
  // "Translate with Gemini" on the Read screen: an explicit opt-in click (Req 12.6).
  on("aitranslate",()=>{ S.aiOptIn = true; if (S.learnerContent) requestAiPhrases(S.learnerContent); render(); });
  on("next",()=>{ S.screen="build"; S.i=0; render(); });
  on("toggle",()=>{ S.showEn=!S.showEn; render(); });
  on("back", goBack);

  document.querySelectorAll("[data-card]").forEach(b=>b.addEventListener("click",()=>{
    S.card = S.card===b.dataset.card ? null : b.dataset.card; render(); }));
  document.querySelectorAll("[data-say]").forEach(b=>b.addEventListener("click",()=>{
    speakFrench(b.dataset.say, b); }));
  on("closecard",()=>{ S.card=null; render(); });
  const my=$("myline");
  if(my) my.addEventListener("input",e=>{ S.mine[S.card]=e.target.value; });

  document.querySelectorAll("[data-chip]").forEach(b=>b.addEventListener("click",()=>{
    S.built.push(b.dataset.chip); S.checked=false; render(); }));
  document.querySelectorAll("[data-drop]").forEach(b=>b.addEventListener("click",()=>{
    S.built.splice(Number(b.dataset.drop),1); S.checked=false; render(); }));
  on("clear",()=>{ S.built=[]; S.checked=false; render(); });
  on("verify",()=>{
    S.checked=true;
    const at=jamieIdx()[S.i];
    if (norm(S.built.join(" ")) !== norm(conv().turns[at][1])) {
      S.buildTries++;
      if (S.buildTries >= 3){ S.buildShown=true; S.built=chunk(conv().turns[at][1]); }
    }
    render();
  });
  on("buildnext",()=>{
    S.built=[]; S.checked=false; S.buildTries=0; S.buildShown=false;
    if (S.i+1 < jamieIdx().length) S.i++; else { S.screen="say"; S.i=0; }
    render();
  });

  const d=$("draft");
  if(d) d.addEventListener("input",e=>{ S.draft=e.target.value;
    const c=$("check"); if(c) c.disabled=!(S.draft.trim()||S.heard); });
  on("mic",toggleMic);
  on("check",async ()=>{
    const at=sayIdx()[S.i];
    const said=S.draft.trim()||S.heard;
    const btn=$("check"); btn.disabled=true; btn.textContent="Checking…";
    S.verdict = await judge(said, conv().turns[at][1]);
    S.tries++;
    if (S.verdict.kind === "ok") S.revealed = true;
    render();
  });
  on("retry",()=>{ S.verdict=null; S.draft=""; S.heard=""; S.interim=""; render(); });
  on("hint",()=>{ S.hinted=true; render(); });
  on("show",()=>{ S.revealed=true; render(); });
  on("nextline",()=>{
    const at = sayIdx()[S.i];
    // Record each submitted attempt paired with the reference Source_Line it was
    // judged against, keyed by the exercise identity (turn index) used at attempt
    // time (Req 9.1). `theirs` is the verbatim learner (or authored) reference
    // line captured now, so Done pairs by the recorded identity rather than
    // re-deriving it later — correct even if the active source changes.
    // Revisiting a line via the step tabs replaces its earlier attempt, so Done
    // never lists the same line twice.
    const prev = S.said.findIndex(x => x.idx === at);
    if (prev >= 0) { S.said.splice(prev, 1); S.results.splice(prev, 1); }
    S.said.push({ idx: at,
                  mine: (S.draft.trim() || S.heard || "(nothing)"),
                  theirs: conv().turns[at][1],
                  kind: S.verdict ? S.verdict.kind : "off" });
    S.results.push(S.verdict ? S.verdict.kind : "off");
    S.verdict=null; S.draft=""; S.heard=""; S.interim="";
    S.tries=0; S.revealed=false; S.hinted=false;
    if (S.i+1 < sayIdx().length) S.i++; else S.screen="done";
    render();
  });
  on("restart",()=>{ const lv=S.level, src=S.source; S=FRESH(); S.level=lv; S.source=src;
    // Re-hydrate any saved Learner_Content so "Bring your own" is still available
    // on the Set up screen after finishing a session (Req 11.3 / 12.2).
    hydrateLearnerContent(); render(); });

  // Goal-capture prompt (goal-linked-reminders task 7). Save persists via the
  // store; Skip just dismisses. Both leave the app fully usable (Req 1.2).
  on("goalsave",()=>{
    const text = ($("goaltext") ? $("goaltext").value : "").trim();
    const date = $("goaldate") ? $("goaldate").value : ""; // yyyy-mm-dd or ""
    // Save only when a store bridge is present and something was entered.
    // An empty goal behaves like Skip (no persistence) — never crashes.
    if (window.ReminderStore && text) {
      try { window.ReminderStore.saveGoal(text, date || null); } catch {}
    }
    S.goalPromptDismissed = true;
    render();
  });
  on("goalskip",()=>{ S.goalPromptDismissed = true; render(); });

  // Notification opt-in (task 10, Req 5.1/5.2). This is the ONLY place that
  // requests permission, and only from this click — never on load. On grant we
  // register the worker (inside enable()) and fire ONE confirming nudge for the
  // next thing, respecting the two-touch cap via maybeNotify. On deny/unsupported
  // we say so plainly and keep the in-app banner (Req 5.4/5.6).
  on("pushenable", async ()=>{
    const push = window.ReminderPush;
    if (!push || !push.enable) { S.pushOptInDismissed = true; return render(); }
    const btn = $("pushenable");
    if (btn) { btn.disabled = true; btn.textContent = "Asking…"; }
    let result = "default";
    try { result = await push.enable(); } catch { result = "unsupported"; }

    if (result === "granted") {
      // Confirming first nudge for the current next thing (honest, in-app moment).
      try { await sendReminderNudge(); } catch {}
      S.pushOptInDismissed = true;
      return render();
    }
    // Deny / unsupported / dismissed: reflect it in the note, keep the banner.
    const note = $("pushoptinnote");
    if (note) {
      note.textContent =
        result === "denied"
          ? "No problem — notifications are blocked, so the reminder will wait inside the app."
          : result === "unsupported"
          ? "This browser can't show notifications — the reminder will wait inside the app."
          : "Okay — you can turn this on later in ⚙ Reminders. The reminder waits inside the app either way.";
    }
    if (btn) { btn.disabled = false; btn.textContent = "Yes, nudge me"; }
    // Leave the block visible with the honest note; don't dismiss on non-grant.
  });
  on("pushnothanks",()=>{ S.pushOptInDismissed = true; render(); });

  const h=$("heard");
  if(h) h.innerHTML = esc(S.heard) + (S.interim?" <i>"+esc(S.interim)+"</i>":"");
}

/* runImport (content-to-exercise task 9.1). Reads the current textarea value
   (falling back to the preserved S.importText), runs the pure Content_Importer,
   and records the outcome in state. Pure-UI glue: all the normalization /
   decline / warn logic lives in importContent — this only reflects its result.

   - On ok: store the accepted Source_Lines as S.learnerContent and persist them
     locally (Req 12.2 via the module's local-only persistence). Routing them
     through Read/Build/Say-it/Done is task 9.2.
   - On decline/warn: keep S.importText verbatim (Req 3.4) and let importerHTML
     show importResult.message. The Authored_Content path stays available the
     whole time (Req 3.5, 11.3).
   - confirmed=true is the "Use it anyway" path for the not-French warning
     (Req 3.3): the learner has explicitly chosen to proceed, so we take the
     Source_Lines the importer segmented and treat them as accepted. If that
     still yields fewer than two lines we fall back to the honest too_few decline
     rather than inventing material. */
function runImport(confirmed){
  const bridge = window.ContentToExercise;
  if (!bridge || !bridge.importContent) return;

  const box = $("importtext");
  const text = box ? box.value : (S.importText || "");
  S.importText = text;

  const result = bridge.importContent(text);

  if (result.ok) {
    S.learnerContent = result.sourceLines;
    S.importedText = text;
    S.importResult = null;
    S.importConfirm = false;
    try { bridge.saveLearnerContent(result.sourceLines); } catch {}
    S.aiPhrases = null; S.aiTranslations = null; S.aiStatus = null; S.aiNote = "";
    saveAiPhrases(null);
    if (S.aiOptIn) requestAiPhrases(result.sourceLines);
    return render();
  }

  // Not French + the learner explicitly confirmed: proceed on the Source_Lines
  // the importer already segmented (Req 3.3). Never fabricate — if there still
  // aren't two lines, show the honest too_few message instead.
  if (confirmed && result.reason === "not_french" && bridge.attributeSourceLines) {
    let lines = [];
    try { lines = bridge.attributeSourceLines(text).sourceLines || []; } catch { lines = []; }
    if (lines.length >= 2) {
      S.learnerContent = lines;
      S.importedText = text;
      S.importResult = null;
      S.importConfirm = true;
      try { bridge.saveLearnerContent(lines); } catch {}
      return render();
    }
    S.importResult = { ok:false, reason:"too_few",
      message:"That's not quite enough to practise with yet. Add a bit more text so " +
        "there are at least two sentences to work with.",
      sourceLineCount: lines.length, preservedText: text };
    S.importConfirm = false;
    return render();
  }

  // Plain decline/warn: record it so importerHTML can show the message; the
  // typed text is already preserved in S.importText.
  S.importResult = result;
  S.learnerContent = null;
  S.importConfirm = false;
  render();
}

/* Opt-in Gemini phrase picker (Req 12.6). Called ONLY from runImport when the
   learner has ticked the Gemini box. Sends just the French lines of the
   accepted import to this app's own server (/api/phrases), which asks Gemini to
   choose phrases from them. The answer is untrusted: buildExercises keeps only
   phrases found word for word in the text, and any failure falls back to the
   built-in picker with a plain-English note. The suggestions are kept in local
   storage beside the import (same device-only rule as the text itself). */
const AI_PHRASES_KEY = "content-to-exercise/ai-phrases";
function linesKey(lines){ return (lines || []).map(l => l.fr).join("\n"); }
function saveAiPhrases(phrases, translations){
  try {
    if (!phrases) localStorage.removeItem(AI_PHRASES_KEY);
    else localStorage.setItem(AI_PHRASES_KEY,
      JSON.stringify({ text: linesKey(S.learnerContent), phrases, translations: translations || null }));
  } catch {}
}
async function requestAiPhrases(lines){
  const sent = linesKey(lines);
  S.aiStatus = "pending";
  let data = null;
  try {
    const r = await fetch("/api/phrases", { method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ lines: lines.map(l => l.fr) }) });
    data = await r.json();
  } catch { data = null; }
  // The learner re-imported different text meanwhile: drop this stale answer.
  if (linesKey(S.learnerContent) !== sent) return;
  const phrases = data && Array.isArray(data.phrases) ? data.phrases : [];
  const translations = data && Array.isArray(data.translations) &&
    data.translations.length === lines.length ? data.translations : null;
  S.aiTranslations = translations;
  if (phrases.length || translations) {
    S.aiPhrases = phrases.length ? phrases : null; S.aiStatus = "ai"; S.aiNote = "";
    saveAiPhrases(phrases, translations);
    // Already practising (pressed Start before Gemini answered): swap in the
    // new word cards so the Read screen highlights Gemini's picks.
    const bridge = window.ContentToExercise;
    if (S.learnerSession && bridge && bridge.buildExercises) {
      try { S.learnerSession.wordCards = bridge.buildExercises(S.learnerContent, { phrases }).wordCards; } catch {}
    }
  } else {
    S.aiPhrases = null; S.aiTranslations = null; S.aiStatus = "fallback";
    S.aiNote = (data && data.note) || "Gemini couldn't be reached.";
  }
  render();
}

/* hydrateLearnerContent (content-to-exercise task 9.1, Req 11.3 / 12.5). On
   load — and again once the module bridge is ready — pull any previously saved
   Learner_Content from local storage. A null result (first run, or cleared
   storage) leaves S.learnerContent null so the app runs fully on
   Authored_Content. Pre-filling S.importText from a prior import lets the
   learner see and edit it rather than re-paste. */
function hydrateLearnerContent(){
  const bridge = window.ContentToExercise;
  if (!bridge || !bridge.loadLearnerContent) return;
  let stored = null;
  try { stored = bridge.loadLearnerContent(); } catch { stored = null; }
  if (stored && stored.length) {
    S.learnerContent = stored;
    if (!S.importText) S.importText = stored.map(l => l.fr).join("\n");
    S.importedText = S.importText; // unchanged box ⇒ Start doesn't re-import
    // Restore Gemini's earlier picks only if they belong to this exact text.
    try {
      const saved = JSON.parse(localStorage.getItem(AI_PHRASES_KEY) || "null");
      if (saved && saved.text === linesKey(stored) && Array.isArray(saved.phrases)) {
        S.aiPhrases = saved.phrases.length ? saved.phrases : null; S.aiStatus = "ai";
        S.aiTranslations = Array.isArray(saved.translations) ? saved.translations : null;
      }
    } catch {}
  }
}

function goBack(){
  S.card=null; S.verdict=null; S.draft=""; S.heard=""; S.tries=0; S.revealed=false; S.hinted=false;
  S.built=[]; S.checked=false; S.buildTries=0; S.buildShown=false;
  if (S.screen==="done"){ S.screen="say"; S.i=sayIdx().length-1; S.results.pop(); S.said.pop(); }
  else if (S.screen==="say"){ if(S.i>0) S.i--; else { S.screen="build"; S.i=jamieIdx().length-1; } }
  else if (S.screen==="build"){ if(S.i>0) S.i--; else S.screen="read"; }
  else if (S.screen==="read"){ S.screen="pick"; S.key=null; S.chosen=false; }
  else if (S.screen==="pick"){ S.screen="start"; }
  render();
}

/* quietReschedule (goal-linked-reminders task 11). When a reminder is NOT acted
   on — the learner dismisses the banner, or a nudge goes unanswered — the app
   advances the next reminder slot with the pure engine's schedule() and records
   ONLY the new lastReminderAt via the store. It records NO miss, NO streak, NO
   penalty anywhere (Req 6.1, Property 2): the sole state that changes is
   lastReminderAt (plus touches, only when a notification is actually sent). A
   long-past lastReminderAt yields a single future slot, never a backlog (Req
   6.4). Feature-detected so the app keeps working without the module bridge. */
function quietReschedule(){
  const engine = window.ReminderEngine;
  const store = window.ReminderStore;
  if (!engine || !engine.schedule || !store || !store.setLastReminderAt) return;
  try {
    const st = store.loadState();
    const now = Date.now();
    // schedule() spreads reminders at the learner's cadence, at most one/day,
    // and collapses any long gap into ONE future slot (no stacking) (Req 2.4/6.4).
    const next = engine.schedule({
      weeklyTarget: st.weeklyTarget,
      lastReminderAt: st.lastReminderAt,
      now,
    });
    // Record only the moment the reminder was offered — never a count.
    store.setLastReminderAt(next);
  } catch {
    // If anything goes wrong, do nothing: still no miss recorded, app unaffected.
  }
}

/* sendReminderNudge (task 10). Fires a locally-scheduled notification for the
   current next thing via window.ReminderPush.maybeNotify, composing from local
   store data + authored content (nothing leaves the device, Req 7.2). The
   two-touch cap and "under cap?" check live inside maybeNotify (Req 5.5,
   Property 7), so calling this more than twice for the same item is harmless —
   the third call is a no-op (permanent silence). Feature-detected throughout. */
async function sendReminderNudge(){
  const push = window.ReminderPush;
  const engine = window.ReminderEngine;
  const store = window.ReminderStore;
  if (!push || !push.maybeNotify || !engine || !store) return false;

  let item = null;
  try { item = engine.nextThing({ completed: [] }); } catch { item = null; }
  if (!item) return false; // nothing due -> nothing to send (Req 4.4)

  let goal = "", targetDate = null;
  try {
    const st = store.loadState();
    goal = st.goal || "";
    targetDate = st.targetDate || null;
  } catch { goal = ""; targetDate = null; }

  try { return await push.maybeNotify({ nextThing: item, goal, targetDate }); }
  catch { return false; }
}

/* Jump into the mission "at the next thing" (task 10). Used when the app is
   opened from a notification click (SW appends #next), and when a controlled
   tab receives the SW's 'open-next' message. With no weekend chosen yet this is
   the pick step; otherwise resume reading. Clears any dismiss so the banner and
   flow line up. */
function openNextThing(){
  S.reminderDismissed = true;      // acted on via the notification
  S.screen = S.key ? "read" : "pick";
  render();
}
window.onReminderOpenNext = openNextThing;

// If the module bridge finishes loading after the app has already rendered,
// re-render so the goal prompt (done screen) and the in-app reminder banner
// (any screen) can appear now that the store/engine are available.
window.onReminderStoreReady = () => {
  render();
};

// Content-to-exercise bridge ready (task 9.1). Hydrate any saved Learner_Content
// and re-render so the importer UI on the Set up screen replaces its "loading…"
// placeholder. Until this fires the app runs fully on Authored_Content (Req 11.3).
window.onContentImporterReady = () => {
  hydrateLearnerContent();
  render();
};

// Notification click deep-link (task 10): the service worker opens the app with
// a #next hash meaning "jump to the next thing". Read it once on load and jump.
// This does NOT request permission (Req 5.2) — it only reacts to a click.
if (typeof location !== "undefined" && location.hash === "#next") {
  S.screen = S.key ? "read" : "pick";
}

// Hydrate saved Learner_Content before the first paint when the bridge is
// already available (it may also arrive later via onContentImporterReady).
hydrateLearnerContent();

render();
</script>
</body>
</html>
