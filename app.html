<!doctype html>
<!--
  WEEKEND MISSION — prototype
  ===========================
  set up → pick a weekend → read → build → say → done

  WHERE THE FRENCH COMES FROM
  Every French sentence is from your three conversations. Nothing is invented.
  Word-card examples are found by scanning all three conversations for the
  phrase, so a phrase used in two weekends shows both real contexts. Phrases
  appearing once show one — that improves as conversations are added, and is
  honest in the meantime.

  The Gemini matcher returns a verdict, ENGLISH feedback, and suggestions that
  must be copied verbatim from our own phrase list. It never writes French.

  Run: npm start  ->  http://localhost:8777/weekend-mission-prototype.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>French conversations</title>

  #reminderbanner:empty{display:none}
  .reminder{max-width:680px;margin:0 auto;padding:13px 18px;background:var(--soft);
    border-bottom:1px solid #c3ded1;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .reminder .rtext{flex:1;min-width:200px}
  .reminder .rtitle{display:block;font-weight:750;color:var(--accent)}
  .reminder .rbody{display:block;margin-top:2px;color:var(--muted);font-size:.92rem}
  .reminder .ractions{display:flex;gap:8px;flex-wrap:wrap}
  .reminder .rstart{padding:9px 15px;border:1px solid var(--accent);background:var(--accent);

    border-radius:11px;color:var(--muted);font-weight:650}

  .remlink:hover{border-color:var(--accent);color:var(--accent)}
  .setcadence{display:block;font-weight:750;color:var(--accent);font-size:1.05rem}

  .pushstate{font-weight:750;color:var(--accent)}
  main{max-width:680px;margin:0 auto;padding:26px 18px}
  .steps{display:flex;gap:6px;margin-bottom:16px}

<body>
<div id="demoribbon"></div>
<!--
  In-app reminder banner (goal-linked-reminders spec, task 8). Lives OUTSIDE
  #app so it sits at the top of the app shell, above every screen, and is not
  wiped when render() replaces #app's innerHTML. renderBanner() fills it on
  every render; it stays empty (shows nothing) when no next thing is due
  (Req 4.4) or when dismissed this session (Req 4.3).
-->
<div id="reminderbanner"></div>
<!--
  Persistent "Reminders" control (goal-linked-reminders task 9). A small link in
  the app shell that opens the settings screen from anywhere in the mission
  flow. Hidden while settings is open (you leave via its own Done control).
  render() fills #reminderlink on every render and wires #settingsopen.
-->
<div id="reminderlink"></div>
<main id="app"></main>

<!--
  Reminder store bridge (goal-linked-reminders spec, task 7).
  The main app script below is a classic (non-module) script, so it cannot
  `import` the ES-module store directly. This module imports the store and
  attaches the functions the app needs on `window.ReminderStore`. The classic
  script feature-detects `window.ReminderStore` before calling it, so the app
  keeps working even if this module hasn't loaded (or fails to load) yet.
-->
<script type="module">
  import { saveGoal, clearGoal, loadState, setWeeklyTarget, setPushPref, recordTouch, setLastReminderAt }
    from './reminders/reminder-store.js';
  import { nextThing, composeCopy, schedule }
    from './reminders/reminder-engine.js';
  // Settings panel (task 9) needs the cadence + push writers too; the classic
  // script feature-detects each before use, so missing writers never crash it.
  // recordTouch is exposed for the notification path (task 10) so it can bump
  // the per-item touch count when a reminder is sent (two-touch cap, Req 5.5).
  // setLastReminderAt is exposed for the quiet-reschedule wiring (task 11): when
  // a reminder is NOT acted on, the app advances lastReminderAt via schedule()
  // and records ONLY that timestamp — never a miss/streak/penalty (Req 6.1,
  // Property 2). It is the sole field that changes on an unacted reschedule.
  window.ReminderStore = { saveGoal, clearGoal, loadState, setWeeklyTarget, setPushPref, recordTouch, setLastReminderAt };
  // The in-app banner (task 8) needs the pure engine too. Attach it on a
  // separate namespace; the classic script feature-detects window.ReminderEngine
  // before use, so the app keeps working even if this module never loads.
  // schedule() is exposed so the quiet reschedule (task 11) can compute the next
  // slot from the learner's weeklyTarget without recording any miss (Req 6.1).
  window.ReminderEngine = { nextThing, composeCopy, schedule };

  // ---- Notification path (goal-linked-reminders task 10) -------------------
  //
  // v1 uses LOCALLY-SCHEDULED notifications via a service worker, NOT server
  // Web Push: no VAPID, no subscription, no server state, no learner data
  // leaving the device (Req 7.2). This helper is the ONLY place permission is
  // requested — and only from a user opt-in, NEVER on page load (Req 5.2).
  //
  // window.ReminderPush = { supported, permissionState, enable, maybeNotify }
  //   supported()        feature-detect SW + Notification (Req 5.6)
  //   permissionState()  current Notification.permission ("default"|"granted"|"denied")
  //   enable()           opt-in: request permission, register sw.js on grant,
  //                      record the resulting push pref via the store
  //   maybeNotify(opts)  compose + post a 'show-reminder' to the SW, but ONLY
  //                      if the item is under the two-touch cap; records a touch
  //
  // The classic script feature-detects window.ReminderPush before use, so the
  // app keeps working even if this module never loads.
  const MAX_TOUCHES = 2; // one + one follow-up, then permanent silence (Req 5.5)

  function pushSupported() {
    try {
      return typeof navigator !== 'undefined' &&
        'serviceWorker' in navigator &&
        typeof window !== 'undefined' &&
        'Notification' in window;
    } catch {
      return false;
    }
  }

  function permissionState() {
    try {
      if (!('Notification' in window)) return 'unsupported';
      return Notification.permission; // "default" | "granted" | "denied"
    } catch {
      return 'unsupported';
    }
  }

  let swRegistration = null;

  async function registerServiceWorker() {
    // Root-scoped so the worker can control the app and open it on click.
    try {
      swRegistration = await navigator.serviceWorker.register('./sw.js');
      // Route SW click messages ("open-next") to the page so an already-open
      // tab can jump to the next thing.
      navigator.serviceWorker.addEventListener('message', (event) => {
        const data = event && event.data;
        if (data && data.type === 'open-next' &&
            typeof window.onReminderOpenNext === 'function') {
          window.onReminderOpenNext();
        }
      });
      return swRegistration;
    } catch {
      // Registration failed: degrade to in-app only (Error Handling). The
      // caller records 'unsupported' so the UI shows the plain fallback note.
      swRegistration = null;
      return null;
    }
  }

  // enable(): the opt-in handler. Requests permission (only here!), and on grant
  // registers the service worker. Records the resulting preference via the
  // store so settings + copy reflect it honestly. Returns the final push pref.
  async function enable() {
    if (!pushSupported()) {
      try { setPushPref('unsupported'); } catch {}
      return 'unsupported';
    }
    let result;
    try {
      result = await Notification.requestPermission();
    } catch {
      // Some browsers use the callback form; treat a throw as unsupported.
      try { setPushPref('unsupported'); } catch {}
      return 'unsupported';
    }
    if (result === 'granted') {
      const reg = await registerServiceWorker();
      const pref = reg ? 'granted' : 'unsupported';
      try { setPushPref(pref); } catch {}
      return pref;
    }
    if (result === 'denied') {
      try { setPushPref('denied'); } catch {}
      return 'denied';
    }
    // "default" — dismissed without choosing; leave as unset.
    return 'default';
  }

  // maybeNotify({ nextThing, goal, targetDate }): compose honest copy and post
  // a 'show-reminder' to the SW — BUT only when permission is granted, a worker
  // is available, and the item is UNDER the two-touch cap (Req 5.5, Property 7).
  // Records a touch when it sends; after two touches the item is permanently
  // silent. Returns true if a notification was posted, false otherwise.
  async function maybeNotify({ nextThing: item, goal, targetDate } = {}) {
    if (!item || typeof item.itemId !== 'string') return false;
    if (!pushSupported()) return false;
    if (permissionState() !== 'granted') return false;

    // Two-touch cap: read the current touch count from the store and stop once
    // it has reached MAX_TOUCHES (Req 5.5, Property 7). Never leaves the device.
    let touches = 0;
    try { touches = (loadState().touches || {})[item.itemId] || 0; } catch { touches = 0; }
    if (touches >= MAX_TOUCHES) return false; // permanent silence for this item

    // Compose the copy client-side from local data + authored content (Req 7.2).
    let copy = null;
    try { copy = composeCopy({ nextThing: item, goal, targetDate }); } catch { copy = null; }
    if (!copy) return false;

    // Ensure a worker is available (registers on first use if opted in already).
    try {
      if (!swRegistration) {
        swRegistration =
          (await navigator.serviceWorker.getRegistration()) ||
          (await registerServiceWorker());
      }
      await navigator.serviceWorker.ready;
    } catch {
      return false; // no worker -> in-app banner remains the fallback
    }
    const controller = navigator.serviceWorker.controller ||
      (swRegistration && swRegistration.active);
    if (!controller || typeof controller.postMessage !== 'function') return false;

    controller.postMessage({
      type: 'show-reminder',
      title: copy.title,
      body: copy.body,
      itemId: item.itemId,
    });

    // Record the touch AFTER a successful post (bumps toward the cap, Req 5.5).
    try { recordTouch(item.itemId); } catch {}
    return true;
  }

  window.ReminderPush = {
    supported: pushSupported,
    permissionState,
    enable,
    maybeNotify,
  };

  // If the learner opted in previously (Notification.permission is already
  // "granted"), re-attach the worker so click-routing works — WITHOUT ever
  // requesting permission (that only happens in enable(), Req 5.2).
  if (pushSupported() && permissionState() === 'granted') {
    registerServiceWorker();
  }

  // Let the app re-render once the store/engine are available, in case a screen
  // (the end-of-session goal prompt, or the banner) was already rendered before
  // this module finished loading.
  if (typeof window.onReminderStoreReady === 'function') {
    window.onReminderStoreReady();
  }
</script>

<!--
  Content-to-exercise bridge (content-to-exercise spec, task 9.1).
  Same pattern as the reminders bridge above: the main app script is a classic
  (non-module) script and cannot `import` the ES-module importer directly. This
  module imports the pure Content_Importer / Exercise_Builder surface and
  attaches it on `window.ContentToExercise`. The classic script feature-detects
  it before use, so the app keeps running fully on Authored_Content even if this
  module never loads (Req 11.3 empty state).

  Task 9.1 only needs importContent + the persistence load/save for the empty
  state. The builder/adapter are exported here too so tasks 9.2–9.4 can wire the
  Read/Build/Say-it/Done screens without touching this bridge again.
-->
<script type="module">
  // Dynamic import so a failed load is caught and reported on the Set up screen
  // instead of leaving "Bring your own — loading…" up forever.
  let mod;
  try {
    mod = await import('./src/content-to-exercise/index.js');
  } catch (e) {
    window.ContentToExerciseError = String(e && e.message || e);
    console.error('content-to-exercise failed to load:', e);
    if (typeof window.onContentImporterReady === 'function') window.onContentImporterReady();
    throw e;
  }
  const {
    importContent, attributeSourceLines, buildExercises, degradedReasons,
    judgeLearnerAttempt, saveLearnerContent, loadLearnerContent,
  } = mod;

  // attributeSourceLines is exposed alongside importContent so the "Use it
  // anyway" confirmation for a not-French warning (Req 3.3) can obtain the same
  // Source_Lines importContent segments internally, without re-deriving them in
  // the classic script.
  //
  // degradedReasons is exposed so the Set up / Choose screens can surface a
  // plain-English reason when a build step falls back to its defined degraded
  // form — zero Word_Cards, a decoy-free Build, or the neutral default Scene
  // (Req 10.5). It never invents French and leaves the recorded learner material
  // unchanged; buildExercises(...).degradedReasons carries the same list.
  window.ContentToExercise = {
    importContent, attributeSourceLines, buildExercises, degradedReasons,
    judgeLearnerAttempt, saveLearnerContent, loadLearnerContent,
  };

  // Re-render once the importer is available, in case the Set up screen was
  // already drawn before this module finished loading (mirrors the reminders
  // bridge). The classic script defines onContentImporterReady.
  if (typeof window.onContentImporterReady === 'function') {
    window.onContentImporterReady();
  }
</script>

   scanning all three conversations, so every example is real usage you wrote. */
const PHRASES = {
  "t'as":            {en:"you have / did you",        note:"Spoken contraction of « tu as ». Almost nobody says « tu as » out loud."},
  "plutôt":          {en:"pretty / quite / rather",   note:"Softens whatever follows. « Oui, plutôt » = yes, but not amazingly."},
  "carrément":       {en:"totally, absolutely",       note:"Strong agreement in one word. Can stand alone as a whole reply."},
  "quand même":      {en:"still / even so / wow",     note:"Two jobs: concession (« still »), and surprise (« quatre heures ? quand même ! »)."},
  "en plus":         {en:"on top of that",            note:"Adds a second reason. Usually starts the sentence."},
  "franchement":     {en:"honestly",                  note:"Signals candour. Softer than English « frankly » — very common."},
  "plein":           {en:"loads, tons",               note:"Casual replacement for « beaucoup ». « Plein ! » works as a one-word answer."},
  "sérieux":         {en:"seriously?",                note:"Disbelief, no verb needed."},
  "j'ai jamais":     {en:"I've never",                note:"Spoken French drops the « ne ». Writing would be « je n'ai jamais »."},
  "t'aurais dû":     {en:"you should have",           note:"« T'aurais dû filmer » = you should've filmed it."},
  "ça devait être":  {en:"that must have been",       note:"Reacting to someone else's story. Follow with an adjective."},
  "pas grand-chose": {en:"not much",                  note:"The standard answer when nothing happened. Complete on its own."},
  "à peine":         {en:"barely, hardly",            note:"« Je suis à peine sorti » = I barely went out."},
  "la grasse matinée":{en:"a lie-in",                 note:"« Faire la grasse matinée » = to sleep in. Literally: the fat morning."},
  "pour l'instant":  {en:"so far, for now",           note:"Hedges a judgement you might revise later."},
  "au début":        {en:"at first",                  note:"Pairs with « mais après » to describe something that changed."},
  "tout à coup":     {en:"all of a sudden",           note:"For time getting away from you."},
  "bof":             {en:"meh",                       note:"One syllable of unenthusiasm. Very useful, a bit blunt with strangers."},
  "pas vraiment":    {en:"not really",                note:"Softer than « non ». Buys a second before you explain."},
  "pour être honnête":{en:"to be honest",             note:"Prepares the other person for something mildly negative."},
  "rien de grave":   {en:"nothing serious",           note:"Reassures before you explain. « Rien de » + adjective is the pattern."},
  "j'ai pas":        {en:"I haven't / I didn't",      note:"Dropped « ne » again. Everywhere in speech, never in formal writing."},
  "ah mince":        {en:"oh no / oh dear",           note:"Mild sympathy. Safe in any company."},
  "je déteste ça":   {en:"I hate that",               note:"Sympathising by sharing the feeling."},
  "c'est déjà ça":   {en:"that's something at least", note:"Finding the small positive in a bad situation."},
  "au moins":        {en:"at least",                  note:"Often opens the silver-lining sentence."},
  "exactement":      {en:"exactly",                   note:"Agreeing enthusiastically. « C'est exactement ça » = that's exactly it."},
  "je vois":         {en:"I see",                     note:"Shows you're following without adding anything. Keeps the turn moving."},
  "chez moi":        {en:"at / to my place",          note:"« Chez » + person. « Près de chez moi » = near my place."},
  "envie de":        {en:"to feel like (doing)",      note:"« T'avais envie de te reposer ? » — want, in the mood sense."}
};

/* Example gathering for a word-card. For Authored_Content this scans ALL three
   authored conversations for verbatim uses of the phrase, unchanged (Req 11.4
   Authored half). content-to-exercise task 9.2 extends this to ALSO include the
   learner's own Source_Lines as example sources when a learner session is active
   (Req 11.4 learner half): the examples come from S.learnerSession.wordCards —
   verbatim learner French, labelled with the learner-facing origin the builder
   recorded (speaker · line N). Authored_Content examples are returned exactly as
   before for Authored_Content sessions. */
function usesOf(phrase){
  if (learnerActive()){
    const card = S.learnerSession.wordCards[phrase];
    const ex = card && Array.isArray(card.examples) ? card.examples : [];
    return ex.slice(0, 3).map(e => ({ fr:e.fr, en:e.en || "", src:e.src }));
  }
  const out = [];
  Object.entries(WEEKENDS).forEach(([k, w]) => {
    w.turns.forEach(([who, fr, en]) => {
      if (fr.toLowerCase().includes(phrase.toLowerCase()))
        out.push({ fr, en, src: w.label + " · " + (who === J ? "you" : "Alex") });
    });
  });
  return out.slice(0, 3);
}

/* The tappable word-card phrases present in the active conversation. For
   Authored_Content these are the PHRASES keys that appear in the chosen weekend
   (unchanged). For a learner session they are the keys of the BuiltSession's
   wordCards — the phrases Exercise_Builder lifted verbatim from the learner's own
   Source_Lines. Both are plain phrase strings the annotate/vocab paths consume
   identically (Req 11.2). */
function phrasesIn(key){
  if (learnerActive())
    return Object.keys(S.learnerSession.wordCards);
  return Object.keys(PHRASES).filter(p =>
    WEEKENDS[key].turns.some(t => t[1].toLowerCase().includes(p.toLowerCase())));
}

/* The {en, note} gloss for a word-card phrase. Authored_Content reads PHRASES;
   a learner session reads the BuiltSession word-card, whose en/note are null when
   the learner supplied no gloss (Req 5.5 — the card still shows its phrase and
   examples, no French fabricated). Returns a uniform {en, note} the card render
   consumes with no branch. */
function glossOf(phrase){
  if (learnerActive()){
    const card = S.learnerSession.wordCards[phrase];
    return { en: card && card.en != null ? card.en : null,
             note: card && card.note != null ? card.note : null };
  }
  const c = PHRASES[phrase] || {};
  return { en: c.en != null ? c.en : null, note: c.note != null ? c.note : null };
}

/* ------------------------------------------------------------- chunking */
function chunk(sentence){
  const parts = sentence.split(/(?<=[,.!?…])\s+/).filter(Boolean);
  const out = [];
  parts.forEach(part => {
    const w = part.split(/\s+/);
    const size = w.length > 6 ? 3 : 2;
    for (let i = 0; i < w.length; i += size) out.push(w.slice(i, i + size).join(" "));
  });
  return out;
}
function decoyLine(turnIndex){
  const others = Object.keys(WEEKENDS).filter(k => k !== S.key);
  const k = others[turnIndex % others.length];
  const pool = WEEKENDS[k].turns.filter(t => t[0] === J);
  return pool[(turnIndex * 3) % pool.length][1];
}
/* The Build-step chip pool (shuffled target chunks + decoys) for a turn. For
   Authored_Content this draws up to 2 decoys from OTHER authored weekends via
   decoyLine (unchanged). content-to-exercise task 9.2: a learner session asks the
   BuiltSession's buildFor(index), whose decoys come only from the learner's own
   OTHER Source_Lines (Req 6.2) and are decoy-free when the content has no other
   line (Req 6.6). Both return a flat array of chunk strings the Build screen
   renders identically (Req 11.2). */
function poolFor(turnIndex){
  if (learnerActive())
    return S.learnerSession.buildFor(turnIndex).pool;
  const target = chunk(conv().turns[turnIndex][1]);
  const decoys = chunk(decoyLine(turnIndex)).filter(c => !target.includes(c)).slice(0, 2);
  return [...target, ...decoys]
    .map((c,n)=>({c, o:(turnIndex*7 + n*13 + c.length*3) % 97}))
    .sort((a,b)=>a.o-b.o).map(x=>x.c);
}

/* --------------------------------------------------------- comparing ---- */
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[^a-z0-9\s']/g," ").replace(/\s+/g," ").trim();
function similarity(a,b){
  const A2=new Set(norm(a).split(" ")), B2=new Set(norm(b).split(" "));
  if(!A2.size||!B2.size) return 0;
  let hit=0; A2.forEach(w=>{ if(B2.has(w)) hit++; });
  return hit / Math.max(A2.size, B2.size);
}
// Verdict kinds the Say-it screen renders: ok | near | off | skip. Map the
// learner-facing matcher verdicts {works, thin, missed, not checked} onto them so
// a learner session and an Authored_Content session render through the same code.
const LEARNER_VERDICT_KIND = { "works":"ok", "thin":"near", "missed":"off", "not checked":"skip" };

async function judge(said, target){
  // Learner session (content-to-exercise task 9.2): route the attempt through the
  // Say-it matcher adapter, which sends ONLY {scene, accepted:[reference],
  // utterance, vocab} to /api/match, discards any model-generated French, and on
  // any unavailability returns `not checked` so the learner self-judges (Req 8).
  // The reference is the learner's OWN Source_Line (the `target` passed in), never
  // a corrected/generated answer. Result is mapped to the screen's verdict kinds;
  // suggest/structure are left empty so no fabricated French ever reaches render.
  if (learnerActive()){
    const bridge = window.ContentToExercise;
    if (bridge && bridge.judgeLearnerAttempt){
      let v;
      try { v = await bridge.judgeLearnerAttempt(said, target, scene(), phrasesIn(S.key)); }
      catch { v = { kind:"not checked", note:"Matcher unavailable — run npm start.", reference:target }; }
      return { kind: LEARNER_VERDICT_KIND[v.kind] || "skip", note: v.note || "", suggest:[], structure:"" };
    }
    return { kind:"skip", note:"Matcher unavailable — run npm start.", suggest:[], structure:"" };
  }
  // Near-identical to the reference is obviously fine, but say so as an
  // observation, not as "correct" — the reference is one way, not the way.
  if (similarity(said, target) >= 0.8)
    return { kind:"ok", note:"That's almost word for word how a French speaker put it.", suggest:[], structure:"" };
  try {
    const r = await fetch("/api/match", { method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ scene: SCENE.where+" "+SCENE.you+" "+SCENE.want,
        accepted:[target], utterance:said, vocab: phrasesIn(S.key) }) });
    const d = await r.json();
    if (d.error === "no_key")
      return { kind:"skip", note:"No key in .env.local, so this one can't be checked.", suggest:[], structure:"" };
    if (d.verdict === "unchecked")
      return { kind:"skip", note:d.note, suggest:[], structure:"" };
    const kind = d.verdict === "works" ? "ok" : d.verdict === "thin" ? "near" : "off";
    return { kind, note:d.note || "", suggest:d.suggest || [], structure:d.structure || "" };
  } catch {
    return { kind:"skip", note:"Matcher unavailable — run npm start.", suggest:[], structure:"" };
  }
}

const Speech = (()=>{ const C=window.SpeechRecognition||window.webkitSpeechRecognition;
  let r=null;
  return { supported:!!C,
    start(cb){ r=new C(); r.lang="fr-FR"; r.continuous=true; r.interimResults=true;
      r.onresult=e=>{ let f="",l="";
        for(let i=0;i<e.results.length;i++){ const t=e.results[i][0].transcript;
          if (e.results[i].isFinal) f+=t; else l+=t; }
        cb(f.trim(), l.trim()); };
      r.onerror=()=>{}; r.start(); },
    stop(){ if(r){ try{r.stop();}catch(e){} r=null; } } };
})();
function toggleMic(){
  if (S.recording){ Speech.stop(); S.recording=false; if(S.heard&&!S.draft.trim()) S.draft=S.heard; return render(); }
  if (!Speech.supported){ alert("Speech recognition needs Chrome or Edge."); return; }
  S.heard=""; S.interim=""; S.recording=true; render();
  Speech.start((f,l)=>{ S.heard=f; S.interim=l; const e=$("heard");
    if(e) e.innerHTML = (esc(f) + (l?" <i>"+esc(l)+"</i>":"")) || "<i>Listening…</i>"; });
}

/* Read-aloud is deliberately separate from speech recognition: it uses the
   browser's local speech synthesizer, needs no microphone permission, and
   never sends the learner's conversation to a service. */
function speakFrench(text, button){
  if (!text || !("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) return;
  window.speechSynthesis.cancel();
  document.querySelectorAll(".listen.is-speaking").forEach(control=>{
    control.classList.remove("is-speaking");
  });
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "fr-FR";
  utterance.rate = .88;
  const frenchVoice = window.speechSynthesis.getVoices().find(voice => /^fr(?:-|_)/i.test(voice.lang));
  if (frenchVoice) utterance.voice = frenchVoice;
  button.classList.add("is-speaking");
  const done = ()=>{
    button.classList.remove("is-speaking");
  };
  utterance.onend = done;
  utterance.onerror = done;
  window.speechSynthesis.speak(utterance);
}

  const wordChar = /[\p{L}'’-]/u;
  phrasesIn(S.key).sort((a,b)=>b.length-a.length).forEach(k => {
    const lower = out.toLowerCase(), key = k.toLowerCase();
    let at = -1;
    for (let i = lower.indexOf(key); i >= 0; i = lower.indexOf(key, i + 1)) {
      const head = out.slice(0, i);
      if (head.lastIndexOf("<") > head.lastIndexOf(">")) continue;
      if (head.lastIndexOf("<button") > head.lastIndexOf("</button>")) continue;
      if (i > 0 && wordChar.test(out[i - 1])) continue;
      if (wordChar.test(out[i + k.length] || "")) continue;
      at = i; break;
    }
    if (at < 0) return;
    const head = out.slice(0, at);
    out = head + '<button class="wc" data-card="' + esc(k) + '">' +
          out.slice(at, at + k.length) + "</button>" + out.slice(at + k.length);
  });
  return out;
}
function cardHTML(){

/* Step tabs. Set up and Choose are always open; Read/Build/Say it need a
   conversation; Done needs to have been reached once (it summarises attempts). */
function canOpenStep(i){
  const step = ORDER[i];
  if (step === "start" || step === "pick") return true;
  const hasConv = S.chosen && (S.key || learnerActive());
  if (step === "done") return hasConv && S.reached >= ORDER.indexOf("done");
  return !!hasConv;
}
function goToStep(i){
  if (!canOpenStep(i)) return;
  const step = ORDER[i];
  // Leave the current exercise cleanly, like Back does.
  S.card=null; S.verdict=null; S.draft=""; S.heard=""; S.tries=0; S.revealed=false; S.hinted=false;
  S.built=[]; S.checked=false; S.buildTries=0; S.buildShown=false;
  if (step === "build" || step === "say") S.i = 0;
  S.screen = step;
  render();
  window.scrollTo(0, 0);
}

const ORDER = ["start","pick","read","build","say","done"];
function chrome(inner){

  // steps header (task 9). The six mission screens keep their steps intact.
  if (S.screen === "settings") return inner;

  S.reached = Math.max(S.reached || 0, idx);
  const back = idx > 0 ? '<button class="back" id="back">← Back</button>' : "";
  // Each step is a tab: clickable when canOpenStep allows it, greyed otherwise.
  return '<div class="steps">' + NAMES.map((n,i)=>{
    const open = i !== idx && canOpenStep(i);
    return '<div class="' + (i===idx?"on":(i<idx?"done":"")) + (open?" tab":" locked") + '"' +

  }).join("") + "</div>" + back + inner;
}

/* Importer UI (content-to-exercise spec, task 9.1). Shown on the Set up screen
   under the "Bring your own" source. A plain textarea that accepts pasted plain
   text (Req 1.1), wired to window.ContentToExercise.importContent via the module
   bridge. On decline/warn the typed text is preserved verbatim in S.importText
   so it can be edited rather than re-entered (Req 3.4), the plain-English
   message from the importer is shown, and the Authored_Content path stays
   available via the existing "Use ours" option (Req 3.5). When no Learner_Content
   has been accepted the app still runs fully on Authored_Content (Req 11.3) —
   choosing "Start →" and then a weekend uses WEEKENDS exactly as before.

   Routing an accepted import through Read/Build/Say-it/Done is task 9.2, so a
   successful import here is acknowledged in plain English and stored; it does
   not yet change the mission flow. */
function importerHTML(){
  const bridge = window.ContentToExercise;
  // Module bridge not loaded yet: offer nothing but keep the Authored path. The
  // screen re-renders via onContentImporterReady once the module arrives.
  if (!bridge || !bridge.importContent) {
    if (location.protocol === "file:") {
      return '<div class="warnbox"><b>Bring your own needs the local server.</b> ' +
        "This page was opened as a file, and browsers block the code it needs. " +
        "Run <code>npm start</code> in this folder, then open " +
        '<a href="http://localhost:8777">http://localhost:8777</a>. "Use ours" still works here.</div>';
    }
    if (window.ContentToExerciseError) {
      return '<div class="warnbox"><b>Bring your own couldn\'t load.</b> ' +
        "Try a hard refresh (Ctrl+Shift+R). \"Use ours\" still works. Details: " +
        esc(window.ContentToExerciseError) + "</div>";
    }
    return '<div class="warnbox"><b>Bring your own — loading…</b> ' +
      "You can start with our conversation above in the meantime; your own text " +
      "becomes available in a moment.</div>";
  }

  const r = S.importResult;
  let feedback = "";

  if (S.learnerContent && S.learnerContent.length) {
    // An import has been accepted this session. Acknowledge it honestly; the
    // screens that consume it arrive in task 9.2.
    const n = S.learnerContent.length;
    feedback = '<div class="verdict ok" style="margin-top:12px"><b>Your text is ready</b>' +
      "We found " + n + (n===1?" line":" lines") + " of your French. " +
      'Press "Start →" below to read, build, and say it in your own words.</div>';

    // Which picker chose the word cards (Req 12.6) — said plainly either way.
    if (S.aiStatus === "pending")
      feedback += '<p class="note-s">Gemini is picking key phrases and translating (usually a ' +
        "few seconds)… You can carry on: the built-in picks show first " +
        "and are swapped for Gemini's, with English, as soon as they arrive.</p>";
    else if (S.aiStatus === "ai")
      feedback += '<p class="note-s">Key phrases picked by Gemini, all taken word for ' +
        "word from your text" + (S.aiTranslations ? ", with Gemini's English translations" : "") + ".</p>";
    else if (S.aiStatus === "fallback")
      feedback += '<p class="note-s">' + esc(S.aiNote || "Gemini couldn't pick phrases.") +
        " Using the built-in phrase picker instead.</p>";

    // Req 10.5: if building the practice from this text had to fall back to a
    // defined degraded form (no word cards, a decoy-free Build, the neutral
    // default Scene), surface the plain-English reason here. The reasons never
    // invent French and leave the recorded learner material unchanged — they
    // only explain honestly why a step is lighter than usual. Feature-detected
    // so the acknowledgement still shows if the helper is unavailable.
    let reasons = [];
    try {
      reasons = bridge.degradedReasons ? bridge.degradedReasons(S.learnerContent) : [];
    } catch { reasons = []; }
    if (reasons.length) {
      feedback += '<div class="warnbox" style="margin-top:12px"><b>A couple of notes</b>' +
        "<ul style=\"margin:6px 0 0;padding-left:18px\">" +
        reasons.map(x => "<li>" + esc(x) + "</li>").join("") +
        "</ul></div>";
    }
  } else if (r && r.ok === false) {
    // Declined or warned. Show the importer's own plain-English message. For the
    // not-French case (requiresConfirmation) offer an explicit confirm action
    // (Req 3.3); the typed text is already preserved in the textarea.
    const kind = r.reason === "not_french" ? "near" : "off";
    feedback = '<div class="verdict ' + kind + '" style="margin-top:12px"><b>' +
      (r.reason === "empty" ? "Nothing to use yet"
        : r.reason === "too_few" ? "A little more, please"
        : r.reason === "not_french" ? "Doesn't look like French"
        : "Can't use this yet") + "</b>" + esc(r.message) +
      (r.requiresConfirmation
        ? '<div class="row"><button class="ghost" id="importconfirm">Use it anyway</button></div>'
        : "") +
      "</div>";
  }

  return '<h2>Bring your own</h2>' +
    '<p class="lede" style="margin-bottom:10px">Paste French you actually want to practise — ' +
    "a short dialogue, a few lines, a passage. We build the practice from your own " +
    "sentences; no French is ever invented for you.</p>" +
    '<textarea id="importtext" placeholder="Collez votre texte français ici…">' +
      esc(S.importText || "") + "</textarea>" +
    '<label class="aiopt' + (S.aiOptIn ? " on" : "") + '">' +
      '<input type="checkbox" id="aioptin"' + (S.aiOptIn ? " checked" : "") + ">" +
      "<span><b>Translate it into English and pick the key phrases with Gemini</b>" +
      "Sends your text to Google. Translations are labelled and may be imperfect; " +
      "key phrases are always taken word for word from your text.</span></label>" +
    '<p class="note-s">' + (S.aiOptIn
      ? "Your text is still stored only on this device. "
      : "Your text stays on this device. ") + "Prefer our conversation? " +
    'Choose "Use ours" above — it works with or without your own material.</p>' +
    feedback;
}

function turnHTML(who, fr, en){
  // The turn's visual side class: authored turns use the raw speaker key
  // (alex/jamie) for styling. A learner turn carries the learner's own label, so
  // use a stable neutral class ("jamie" styling = the learner's own bubble) and
  // show the learner-facing speaker name via speakerName (Req 11.5). The English
  // toggle: when English is on but this turn has no English, show a plain-English
  // "no translation" note instead of any System-generated translation (Req 4.5).
  const side = learnerActive() ? learnerSide(who) : who;
  let enHTML = "";
  // A Gemini machine translation (opt-in, Req 4.6) is used only when the learner
  // gave no English, and is always labelled as such.
  const mt = learnerActive() && !(typeof en === "string" && en.length) ? aiTranslationFor(fr) : "";
  if (S.showEn)
    enHTML = (typeof en === "string" && en.length)
      ? '<span class="en">' + esc(en) + "</span>"
      : mt
      ? '<span class="en">' + esc(mt) + ' <span class="mtlabel">· Gemini translation, may be imperfect</span></span>'
      : '<span class="en">No translation — this line is in your own words.</span>';
  return '<div class="turn ' + side + '"><div class="who">' +
    esc(speakerName(who)) + '</div><div class="bub"><span>' + annotate(esc(fr)) + "</span>" +
    listenHTML(fr) + enHTML + "</div></div>";
}

/* Gemini's English for a learner line (opt-in, Req 4.6), or "" when there is
   none. Translations are stored one per Source_Line, in order. */
function aiTranslationFor(fr){
  if (!Array.isArray(S.aiTranslations) || !S.learnerContent) return "";
  const i = S.learnerContent.findIndex(l => l.fr === fr);
  const t = i >= 0 ? S.aiTranslations[i] : "";
  return typeof t === "string" ? t : "";
}

/* Which side a learner turn sits on, like a chat: speakers alternate left/right
   in order of first appearance; unattributed lines ("You") sit on the right. */
function learnerSide(who){
  if (typeof who !== "string" || !who.length) return J;
  const order = [];
  conv().turns.forEach(t => { if (t[0] && !order.includes(t[0])) order.push(t[0]); });
  return order.indexOf(who) % 2 === 0 ? "alex" : J;
}

function screenBuild(){
  const idxs = jamieIdx(), at = idxs[S.i];
  const line = conv().turns[at][1];
  const target = chunk(line);
  const pool = poolFor(at);
  const right = norm(S.built.join(" ")) === norm(line);
  const before = conv().turns.slice(Math.max(0,at-2), at).map(x=>turnHTML(x[0],x[1],x[2])).join("");

  let msg = null;
  if (S.checked && !right && !S.buildShown) {
    const bad = S.built.findIndex((c,n)=>norm(c)!==norm(target[n]||""));
    const left = 3 - S.buildTries;
    const tail = left > 0 ? " " + left + (left===1?" try":" tries") + " left." : "";
    if (S.built.length < target.length && bad === -1)
      msg = ["Right so far", "Correct up to here, but the line keeps going." + tail];
    else if (bad === 0)
      msg = ["Not that opener", "That isn't how this line starts. Tap it to take it back." + tail];
    else
      msg = ["Not the order", "The first " + bad + (bad>1?" pieces are":" piece is") +
             " right — it goes wrong after « " + S.built[bad-1] + " »." + tail];
  }
  const showHint = S.buildTries >= 1 && !right && !S.buildShown;
  const used = {}; S.built.forEach(c=>used[c]=(used[c]||0)+1);
  const avail = {};

  // Authored_Content always adds 2 decoys, so its lede stays exactly "Two pieces
  // don't belong." (unchanged — Req 11.1/11.4 Authored half). A learner session
  // adds 0..4 decoys and may add 0 when the content has no other line to draw
  // from (Req 6.6), so state the real count honestly rather than always "two".
  let extrasNote = "Two pieces don't belong.";
  if (learnerActive()){
    const extras = Math.max(0, pool.length - target.length);
    extrasNote = extras === 0
      ? "Every piece belongs."
      : extras === 1 ? "One piece doesn't belong."
      : extras === 2 ? "Two pieces don't belong."
      : extras + " pieces don't belong.";
  }
  return chrome("<h1>Now build it</h1>" +
  '<p class="lede">Line ' + (S.i+1) + " of " + idxs.length + ". Same sentence you just read — " +
  "put it back together. " + extrasNote + "</p>" + before +
  '<div class="tray">' + (S.built.length
    ? S.built.map((c,n)=>'<button class="chip in" data-drop="'+n+'">'+esc(c)+"</button>").join("")
    : '<span class="trayhint">Tap the pieces in order…</span>') + "</div>" +
  ((S.checked && right) || S.buildShown
    ? '<div class="verdict ok"><b>' + (S.buildShown?"Here it is":"That's the line") + "</b>" +
      (S.buildShown ? "Three tries is plenty — read it, then move on."
                    : "Word order and register both right.") +
      '<div class="reveal">' + esc(line) + "</div></div>"
    : msg ? '<div class="verdict near"><b>'+esc(msg[0])+"</b>"+esc(msg[1])+"</div>" : "") +
  '<div class="pool">' + pool.map(c=>{
      avail[c]=(avail[c]||0)+1;
      const spent=(used[c]||0)>=avail[c];
      // Highlight the opening piece after a failed try, whatever is in the tray.
      const isHint = showHint && c===target[0] && !spent;
      return '<button class="chip ' + (isHint?"hint":"") + '" data-chip="' + esc(c) + '" ' +
             (spent?"disabled":"") + ">" + esc(c) + "</button>";
    }).join("") + "</div>" +
  (showHint ? '<p class="note-s">Hint: the highlighted piece starts the line.</p>' : "") +
  '<div class="bar">' +
    (((S.checked && right) || S.buildShown)
      ? '<button class="go" id="buildnext">' +
        (S.i+1<idxs.length ? "Next line →" : "Now say it yourself →") + "</button>"
      : '<button class="go" id="verify" ' + (S.built.length?"":"disabled") + ">Verify</button>") +
    '<button class="ghost" id="clear">Clear</button>' +
    '<button class="ghost" id="toggle">' + (S.showEn?"Hide":"Show") + " English</button></div>" +
  cardHTML());
}
